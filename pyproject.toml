[project]
name = "veylora-ide"
version = "0.1.0"
description = "A modular desktop code editor built with Python and PyQt6."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
