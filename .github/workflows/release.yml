name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vsix:
    name: Attach VSIX to GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and compile Veylora Core
        working-directory: extensions/veylora-core
        run: |
          npm install
          npm run compile

      - name: Package VSIX and checksum
        working-directory: extensions/veylora-core
        run: |
          npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository
          sha256sum ./*.vsix > SHA256SUMS
          ls -la ./*.vsix SHA256SUMS

      - name: Publish GitHub Release
        working-directory: extensions/veylora-core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.vsix SHA256SUMS --clobber
          else
            gh release create "$tag" ./*.vsix SHA256SUMS \
              --title "Veylora ${tag}" \
              --generate-notes
          fi
