name: CI

on:
  push:
    branches: [main, "architecture/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install extension dependencies
        run: npm --prefix extensions/veylora-core install
      - name: Test repository integration
        run: npm test
      - name: Type-check Veylora Core
        run: npm run typecheck

  python-validation:
    name: Legacy Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependency
        run: python -m pip install pytest
      - name: Validate legacy Python source
        run: |
          python -m compileall -q legacy veylora
          PYTHONPATH=. pytest
